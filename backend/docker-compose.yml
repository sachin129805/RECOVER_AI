services:
  postgres:
    image: postgres:16-alpine
    container_name: recoverai-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: recoverai
      POSTGRES_USER: recoverai
      POSTGRES_PASSWORD: recoverai_dev_password

    ports:
      - "5432:5432"

    volumes:
      - recoverai_pgdata:/var/lib/postgresql/data

volumes:
  recoverai_pgdata: